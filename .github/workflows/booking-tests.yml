name: Booking branch regression tests

on:
  push:
    branches:
      - feature/prenotazioni-tavoli
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run project and booking regression suite
        run: node --test tests/*.test.mjs
      - name: Validate Cloudflare Pages Functions bundle
        run: npx --yes wrangler@4 pages functions build functions
